<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="45%" stop-color="#241442"/>
      <stop offset="100%" stop-color="#0b081d"/>
    </linearGradient>
    <linearGradient id="l" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="dot" x1="38" y1="14" x2="52" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Vibrant glowing spark/dot -->
  <circle cx="46" cy="18" r="6" fill="url(#dot)" filter="url(#glow)"/>
  <circle cx="46" cy="18" r="2.5" fill="#ffffff"/>
  <!-- Bold crisp L glyph with clear thickness -->
  <path d="M20 12 V43 Q20 48 25 48 H46" fill="none" stroke="url(#l)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>